version: '3.8'

services:
  api:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      - DJANGO_SECRET_KEY=change-this-in-production
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4201,http://localhost:5173
    restart: unless-stopped
